<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitsune License Server — Admin</title>
<style>
  :root{
    --bg:#14110d; --panel:#1d1812; --panel2:#241e16; --line:#33291d;
    --ink:#f4f0e7; --dim:#a99a82; --rust:#c14a28; --gold:#e8a24f;
    --ok:#5bbf6a; --bad:#d6553e;
    font-family:'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5}
  header{background:linear-gradient(180deg,#1d1812,#14110d);border-bottom:1px solid var(--line);
    padding:16px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;letter-spacing:-.3px}
  header h1 span{color:var(--rust)}
  .grow{flex:1}
  input,select,button,textarea{font:inherit}
  input,select{background:#100d09;border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:8px 11px;outline:none}
  input:focus,select:focus{border-color:var(--gold)}
  button{background:var(--rust);color:#fff;border:0;border-radius:8px;padding:8px 14px;
    font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
  button.danger{background:transparent;border:1px solid var(--bad);color:var(--bad);
    padding:4px 10px;font-size:12px}
  button.danger:hover{background:var(--bad);color:#fff}
  main{max-width:1100px;margin:24px auto;padding:0 22px;display:grid;gap:22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card h2{font-size:15px;margin:0;padding:14px 18px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px}
  .card .body{padding:16px 18px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  tr:last-child td{border-bottom:0}
  .pill{font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600}
  .pill.active{background:rgba(91,191,106,.16);color:var(--ok)}
  .pill.revoked,.pill.expired{background:rgba(214,85,62,.16);color:var(--bad)}
  .prod{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);
    border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;margin:0 8px 8px 0}
  .prod.sel{border-color:var(--gold);color:var(--gold)}
  .prod .n{font-size:11px;color:var(--dim)}
  .mono{font-family:'Cascadia Code','JetBrains Mono',Consolas,monospace}
  textarea{width:100%;min-height:120px;background:#0c0c0c;color:var(--gold);border:1px solid var(--line);
    border-radius:8px;padding:12px;resize:vertical}
  .note{color:var(--dim);font-size:12px}
  .err{color:var(--bad);font-size:13px;min-height:18px}
  .hide{display:none}
  .keys-warn{background:rgba(232,162,79,.1);border:1px solid var(--gold);border-radius:8px;
    padding:12px;margin-top:12px}
  .keys-warn b{color:var(--gold)}
</style>
</head>
<body>
<header>
  <h1>Kitsune <span>License</span> Server</h1>
  <div class="grow"></div>
  <input id="token" type="password" placeholder="admin token" style="width:230px">
  <button id="connect">Connect</button>
</header>

<main id="app" class="hide">
  <div class="err" id="err"></div>

  <div class="card">
    <h2>Products</h2>
    <div class="body">
      <div id="products"></div>
      <div class="row" style="margin-top:12px">
        <label>New product name<input id="pname" placeholder="e.g. Survarium Server"></label>
        <button id="addprod">Create</button>
      </div>
    </div>
  </div>

  <div class="card hide" id="keysCard">
    <h2>Keys — <span id="keysFor" class="mono" style="color:var(--gold)"></span></h2>
    <div class="body">
      <div class="row">
        <label>Quantity<input id="kcount" type="number" value="1" min="1" max="1000" style="width:90px"></label>
        <label>Seats / key<input id="kseats" type="number" value="1" min="1" style="width:90px"></label>
        <label>Expiry
          <select id="kexp">
            <option value="never">Never</option>
            <option value="days">In N days</option>
            <option value="date">On date</option>
          </select>
        </label>
        <label id="kdaysWrap" class="hide">Days<input id="kdays" type="number" value="365" min="1" style="width:90px"></label>
        <label id="kdateWrap" class="hide">Date<input id="kdate" type="date"></label>
        <label class="grow">Custom key (optional)<input id="kcustom" class="mono" placeholder="leave blank to auto-generate"></label>
        <button id="genkeys">Generate</button>
      </div>
      <div id="genResult"></div>
      <table style="margin-top:16px">
        <thead><tr><th>Key</th><th>Seats</th><th>Status</th><th>Expires</th><th>Note</th><th></th></tr></thead>
        <tbody id="keyrows"></tbody>
      </table>
    </div>
  </div>

  <div class="card hide" id="actCard">
    <h2>Activations — <span id="actFor" class="mono" style="color:var(--gold)"></span></h2>
    <div class="body"><table>
      <thead><tr><th>OS</th><th>Hostname</th><th>Version</th><th>Activated</th><th>Last seen</th><th>Status</th><th></th></tr></thead>
      <tbody id="actrows"></tbody>
    </table></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let TOKEN = localStorage.getItem('kls_token') || '';
let curProduct = null, curKey = null;

function fmt(ts){ return ts ? new Date(ts*1000).toLocaleString() : '—'; }
function setErr(m){ $('#err').textContent = m || ''; }

async function api(method, path, body){
  const r = await fetch(path, {
    method,
    headers: { 'content-type':'application/json', 'authorization':'Bearer '+TOKEN },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.message || (r.status+' error'));
  return data;
}

$('#token').value = TOKEN;
$('#connect').onclick = async () => {
  TOKEN = $('#token').value.trim();
  localStorage.setItem('kls_token', TOKEN);
  try { await loadProducts(); $('#app').classList.remove('hide'); setErr(''); }
  catch(e){ setErr(e.message); }
};
if(TOKEN){ $('#connect').click(); }

async function loadProducts(){
  const prods = await api('GET','/api/products');
  const el = $('#products'); el.innerHTML = '';
  if(!prods.length) el.innerHTML = '<span class="note">No products yet — create one below.</span>';
  prods.forEach(p => {
    const d = document.createElement('span');
    d.className = 'prod' + (curProduct===p.id ? ' sel':'');
    d.innerHTML = `${p.name} <span class="n">${p.key_count} keys</span>`;
    d.onclick = () => selectProduct(p);
    el.appendChild(d);
  });
}

$('#addprod').onclick = async () => {
  const name = $('#pname').value.trim();
  if(!name) return;
  try { await api('POST','/api/products',{name}); $('#pname').value=''; await loadProducts(); setErr(''); }
  catch(e){ setErr(e.message); }
};

async function selectProduct(p){
  curProduct = p.id;
  $('#keysFor').textContent = p.slug;
  $('#keysCard').classList.remove('hide');
  $('#actCard').classList.add('hide');
  $('#genResult').innerHTML = '';
  await loadProducts();
  await loadKeys();
}

$('#kexp').onchange = () => {
  $('#kdaysWrap').classList.toggle('hide', $('#kexp').value!=='days');
  $('#kdateWrap').classList.toggle('hide', $('#kexp').value!=='date');
};

$('#genkeys').onclick = async () => {
  const body = {
    count: parseInt($('#kcount').value)||1,
    seat_limit: parseInt($('#kseats').value)||1,
  };
  const mode = $('#kexp').value;
  if(mode==='days') body.expires_in_days = parseInt($('#kdays').value)||0;
  if(mode==='date' && $('#kdate').value) body.expires_at = Math.floor(new Date($('#kdate').value).getTime()/1000);
  const custom = $('#kcustom').value.trim();
  if(custom) body.custom_key = custom;
  try {
    const res = await api('POST',`/api/products/${curProduct}/keys`, body);
    $('#kcustom').value='';
    $('#genResult').innerHTML =
      `<div class="keys-warn"><b>${res.keys.length} key(s) generated — copy them now, they are not shown again.</b>
       <textarea readonly>${res.keys.join('\n')}</textarea></div>`;
    await loadKeys(); setErr('');
  } catch(e){ setErr(e.message); }
};

async function loadKeys(){
  const keys = await api('GET',`/api/products/${curProduct}/keys`);
  const tb = $('#keyrows'); tb.innerHTML='';
  keys.forEach(k => {
    const tr = document.createElement('tr');
    const st = k.status==='active' ? 'active':'revoked';
    tr.innerHTML = `
      <td class="mono">${k.prefix}</td>
      <td>${k.seats_used}/${k.seat_limit}</td>
      <td><span class="pill ${st}">${k.status}</span></td>
      <td>${k.expires_at?fmt(k.expires_at):'never'}</td>
      <td class="note">${k.note||''}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="ghost" data-act="${k.id}" style="padding:4px 10px;font-size:12px">Devices</button>
        ${k.status==='active'?`<button class="danger" data-rev="${k.id}">Revoke</button>`:''}
      </td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll('[data-rev]').forEach(b => b.onclick = async () => {
    if(!confirm('Revoke this key? All its devices stop validating.')) return;
    try { await api('POST',`/api/keys/${b.dataset.rev}/revoke`); await loadKeys(); }
    catch(e){ setErr(e.message); }
  });
  tb.querySelectorAll('[data-act]').forEach(b => b.onclick = () => loadActivations(b.dataset.act, b.closest('tr').querySelector('.mono').textContent));
}

async function loadActivations(keyId, label){
  curKey = keyId;
  const acts = await api('GET',`/api/keys/${keyId}/activations`);
  $('#actFor').textContent = label;
  $('#actCard').classList.remove('hide');
  const tb = $('#actrows'); tb.innerHTML='';
  if(!acts.length) tb.innerHTML = '<tr><td colspan="7" class="note">No activations yet.</td></tr>';
  acts.forEach(a => {
    const tr = document.createElement('tr');
    const st = a.status==='active'?'active':'revoked';
    tr.innerHTML = `
      <td>${a.os||'—'}</td><td>${a.hostname||'—'}</td><td>${a.app_version||'—'}</td>
      <td>${fmt(a.activated_at)}</td><td>${fmt(a.last_seen)}</td>
      <td><span class="pill ${st}">${a.status}</span></td>
      <td style="text-align:right">${a.status==='active'?`<button class="danger" data-d="${a.id}">Revoke</button>`:''}</td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => {
    if(!confirm('Revoke this device?')) return;
    try { await api('POST',`/api/activations/${b.dataset.d}/revoke`); await loadActivations(curKey, label); await loadKeys(); }
    catch(e){ setErr(e.message); }
  });
  $('#actCard').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
