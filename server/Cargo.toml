[package]
name = "kitsune-license-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Licensing-key server: online activation, Ed25519-signed tokens, seat enforcement."

[[bin]]
name = "kls"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
data-encoding = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
