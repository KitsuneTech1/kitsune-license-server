[package]
name = "kitsune-activator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Terminal license activator: prompt key, activate online, verify signed token, gate install; --watch runs the runtime Guard."

[[bin]]
name = "ktsn-activate"
path = "src/main.rs"

[dependencies]
kitsune-license-client = { path = "../client" }
serde_json = { workspace = true }
anyhow = { workspace = true }
crossterm = "0.28"
