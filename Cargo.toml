[workspace]
resolver = "2"
members = ["server", "cli", "client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Kitsune Technologies"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
data-encoding = "2"
anyhow = "1"
thiserror = "2"
